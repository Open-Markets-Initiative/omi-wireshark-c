# Generated by Scaled.Wireshark.C.Binary.Dissector 0.1.0, edits are overwritten

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  dissectors:

    # A dissector compiles against the Wireshark it is written for, so the
    # build here is a Wireshark build with these 3 dissectors in it
    name: Compile into Wireshark
    runs-on: ubuntu-latest

    steps:

      - name: Check out the dissectors
        uses: actions/checkout@v4
        with:
          path: dissectors

      - name: Check out Wireshark
        uses: actions/checkout@v4
        with:
          repository: wireshark/wireshark
          ref: master
          path: wireshark

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo ./wireshark/tools/debian-setup.sh --install-optional --install-test-deps -y

      # The build list names the dissectors, so it goes in beside them and
      # Wireshark picks them up without a patch to its own CMakeLists
      # Each protocol has a directory of its own here; wireshark wants every
      # dissector flat in epan/dissectors, which is what the build list names
      - name: Add the dissectors to the build
        run: |
          cp $(find dissectors -name 'packet-*.c') wireshark/epan/dissectors/
          cp dissectors/CMakeListsCustom.txt wireshark/epan/dissectors/

      - name: Configure
        run: cmake -G Ninja -S wireshark -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_wireshark=OFF

      - name: Build
        run: cmake --build build

      # A dissector that compiled but never registered would decode nothing,
      # so each one is asked for by name
      - name: Check every dissector registered
        run: |
          ./build/run/tshark -G protocols | cut -f3 > registered
          for filter in coinbasederivatives.marketdataapi iexequities.tops nsmequities.totalview; do
            if ! grep -qx "$filter" registered; then
              echo "::error::$filter did not register"
              exit 1
            fi
            echo "  $filter"
          done
